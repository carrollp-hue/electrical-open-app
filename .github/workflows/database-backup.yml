name: Encrypted Supabase backup

on:
  workflow_dispatch:
  schedule:
    # Every Sunday at 02:17 UTC (02:17/03:17 UK time, depending on daylight saving).
    - cron: '17 2 * * 0'

permissions:
  contents: read

jobs:
  backup:
    name: Export and encrypt database
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      BACKUP_REPOSITORY: ${{ vars.BACKUP_REPOSITORY }}
      BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
    steps:
      - name: Validate backup configuration
        run: |
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$BACKUP_PASSPHRASE"
          test -n "$BACKUP_REPOSITORY"
          test -n "$BACKUP_REPO_TOKEN"

      - name: Export roles, schema and data
        run: |
          mkdir -p backup
          # Use the PostgreSQL tools directly rather than the Supabase CLI.
          # PGPASSWORD is passed as a container environment variable, so special
          # characters in the database password never need URL encoding.
          export PGHOST="aws-0-eu-west-2.pooler.supabase.com"
          export PGPORT="5432"
          export PGUSER="postgres.xwzrtbjlztdtxvwckqrl"
          export PGDATABASE="postgres"

          docker run --rm \
            -e PGPASSWORD="$SUPABASE_DB_PASSWORD" \
            postgres:17 \
            pg_dumpall --roles-only --no-role-passwords \
              --host="$PGHOST" --port="$PGPORT" --username="$PGUSER" \
            > backup/roles.sql

          docker run --rm \
            -e PGPASSWORD="$SUPABASE_DB_PASSWORD" \
            -v "$PWD/backup:/backup" \
            postgres:17 \
            pg_dump --schema=public --no-owner --no-privileges \
              --host="$PGHOST" --port="$PGPORT" --username="$PGUSER" --dbname="$PGDATABASE" \
              --file=/backup/schema.sql

          docker run --rm \
            -e PGPASSWORD="$SUPABASE_DB_PASSWORD" \
            -v "$PWD/backup:/backup" \
            postgres:17 \
            pg_dump --schema=public --data-only --no-owner --no-privileges \
              --host="$PGHOST" --port="$PGPORT" --username="$PGUSER" --dbname="$PGDATABASE" \
              --file=/backup/data.sql

      - name: Encrypt backup
        id: archive
        run: |
          stamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          archive="electrical-open-${stamp}.tar.gz.enc"
          tar -C backup -czf - roles.sql schema.sql data.sql | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 100000 -pass env:BACKUP_PASSPHRASE -out "$archive"
          echo "file=$archive" >> "$GITHUB_OUTPUT"

      - name: Keep a 90-day encrypted emergency copy in Actions
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.archive.outputs.file }}
          path: ${{ steps.archive.outputs.file }}
          retention-days: 90
          if-no-files-found: error

      - name: Copy encrypted backup to the private backup repository
        run: |
          git clone "https://x-access-token:${BACKUP_REPO_TOKEN}@github.com/${BACKUP_REPOSITORY}.git" private-backups
          mkdir -p private-backups/supabase
          cp "${{ steps.archive.outputs.file }}" private-backups/supabase/
          cd private-backups
          git config user.name "Electrical Open Backup"
          git config user.email "backup@users.noreply.github.com"
          git add supabase/
          git commit -m "Encrypted database backup $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
