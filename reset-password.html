<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#123529">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="password-management.css">
    <title>Reset password · Electrical Open</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar"><a class="brand" href="./" aria-label="Electrical Open home"><span class="flag" aria-hidden="true">⚑</span><span>Electrical Open</span></a></header>
      <main>
        <section class="login-screen">
          <p class="eyebrow">Electrical Open Golf Society</p>
          <h1>Choose a new password</h1>
          <p class="intro">Enter and confirm a new password for your account.</p>
          <form class="password-form" id="reset-password-form" hidden>
            <label>New password<input id="new-password" type="password" autocomplete="new-password" minlength="6" required></label>
            <label>Confirm new password<input id="confirm-password" type="password" autocomplete="new-password" minlength="6" required></label>
            <p class="form-message" id="reset-message"></p>
            <button class="primary" type="submit">Save new password</button>
          </form>
          <p class="form-message" id="reset-status">Checking your reset link…</p>
        </section>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="reset-password.js"></script>
  </body>
</html>
